# Stack para Portainer (Repository ou Web editor com imagem já publicada).
# Variáveis obrigatórias: DB_PASSWORD. Opcional: APP_DOMAIN, TRAEFIK_NETWORK, TRAEFIK_CERTRESOLVER, DB_USER, DB_NAME, SETUP_TOKEN.
# O primeiro administrador é criado pela tela /configurar no primeiro acesso.
# SETUP_TOKEN (opcional): se definido, é exigido nessa tela (evita que um terceiro cadastre o admin primeiro).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jane}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-jane}
    volumes:
      - gentis_pgdata:/var/lib/postgresql/data
    networks: [gentis]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jane} -d ${DB_NAME:-jane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: gentis-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-jane}:${DB_PASSWORD}@db:5432/${DB_NAME:-jane}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_HOURS: 8
      BACKUP_AUTO_HOURS: ${BACKUP_AUTO_HOURS:-24}
      BACKUP_KEEP: 14
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes:
      - gentis_storage:/app/server/storage
    networks: [gentis, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.gentis.rule=Host(`${APP_DOMAIN:-gentis.illo.app.br}`)
      - traefik.http.routers.gentis.entrypoints=websecure
      - traefik.http.routers.gentis.tls=true
      - traefik.http.routers.gentis.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.gentis.loadbalancer.server.port=3001

networks:
  gentis:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  gentis_pgdata:
  gentis_storage:
